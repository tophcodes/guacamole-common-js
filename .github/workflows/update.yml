name: Update upstream

on:
  # Mondays at 12:00 UTC, look for a new Apache Guacamole release.
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # default.nix evaluates without the flake, whose devkit input is private.
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Bump to the newest release
        run: nix shell nixpkgs#just nixpkgs#nix-update -c just update

      - name: Build and smoke-test
        id: build
        run: |
          nix-build default.nix -A guacamole-common-js --no-out-link
          echo "version=$(nix eval --raw -f default.nix guacamole-common-js.version)" >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: update/guacamole
          commit-message: "chore: update guacamole-common-js to ${{ steps.build.outputs.version }}"
          title: "chore: update guacamole-common-js to ${{ steps.build.outputs.version }}"
          body: |
            Apache Guacamole released ${{ steps.build.outputs.version }}: https://github.com/apache/guacamole-client/releases/tag/${{ steps.build.outputs.version }}

            Merging this pull request publishes the version to npm.
          delete-branch: true
